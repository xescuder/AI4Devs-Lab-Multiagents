accommodation_search_task:
  description: >
    Busca alojamientos tipo Airbnb para CADA ZONA ÚNICA del itinerario aprobado.
    El itinerario tiene "overnight_zone" para cada noche. Agrupa las noches
    por zona y busca 3 opciones DIFERENTES por cada zona única.

    IMPORTANTE: Usa las fechas y noches del ITINERARIO APROBADO (contexto),
    no las del formulario original. Si el vuelo cambió las fechas, el
    itinerario ya refleja las fechas correctas.

    {numero_adultos} adulto(s), máximo {presupuesto_max_noche} EUR/noche.

    REQUISITOS:
    - Baño privado: {alojamiento_bano_privado}
    - Cocina: {alojamiento_cocina}

    INSTRUCCIONES:
    1. Del itinerario aprobado, identifica las zonas únicas de "overnight_zone".
    2. Para CADA ZONA ÚNICA (no por noche), usa "Airbnb crawl" UNA sola vez.
    3. Propón 2 opciones DIFERENTES por zona (no 3, para ser más rápido):
       - Cada una con nombre DISTINTO.
    4. Si varias noches consecutivas están en la misma zona, usa las mismas
       opciones (no busques de nuevo). Referencia la zona en cada noche.
    5. NO busques imágenes. Deja image_url vacío ("").
    6. SÉ CONCISO. No repitas opciones. Responde rápido.

    FORMATO: Responde SOLO con JSON válido.
  expected_output: >
    {
      "nights": [
        {
          "night": 1,
          "city": "Ciudad",
          "zone": "Zona",
          "options": [
            {
              "name": "Nombre único del alojamiento",
              "neighborhood": "Barrio",
              "description": "Por qué vale la pena",
              "price": 000,
              "rating": 4.8,
              "private_bathroom": true,
              "kitchen": true,
              "superhost": true/false,
              "image_url": "URL imagen única",
              "listing_url": "URL Airbnb"
            }
          ]
        }
      ],
      "price_range": {"min": 000, "max": 000}
    }
  human_input: true

accommodation_night_task:
  description: >
    Busca 2 opciones de alojamiento en Airbnb para la NOCHE {night_number}
    en {pais_destino}. Capacidad: {numero_adultos} adulto(s).
    Máximo: {presupuesto_max_noche} EUR/noche.
    Requisitos: baño privado={alojamiento_bano_privado}, cocina={alojamiento_cocina}.

    Del itinerario aprobado (contexto), identifica "overnight_zone" para
    la noche {night_number} y busca en ESA zona.

    INSTRUCCIONES:
    1. Usa "Airbnb crawl" con la zona de la noche {night_number}.
    2. Propón 2 opciones DIFERENTES (nombres distintos).
    3. NO busques imágenes. Deja image_url vacío.
    4. SÉ RÁPIDO Y CONCISO. Solo el JSON.
    7. Respeta el presupuesto máximo de {presupuesto_max_noche} EUR/noche.

    FORMATO: Responde SOLO con un JSON válido, sin texto adicional.
  expected_output: >
    {
      "night": {night_number},
      "city": "Ciudad",
      "zone": "Zona/Barrio",
      "options": [
        {
          "name": "Nombre/Tipo",
          "neighborhood": "Barrio",
