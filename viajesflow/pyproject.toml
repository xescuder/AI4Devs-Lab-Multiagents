[project]
name = "viajesflow"
version = "0.1.0"
description = "ViajesFlow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7"
]

[project.scripts]
kickoff = "viajesflow.main:kickoff"
run_crew = "viajesflow.main:kickoff"
plot = "viajesflow.main:plot"
run_with_trigger = "viajesflow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
