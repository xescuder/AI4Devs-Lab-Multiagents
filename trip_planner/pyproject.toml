[project]
name = "trip_planner"
version = "0.1.0"
description = "trip_planner using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7"
]

[project.scripts]
trip_planner = "trip_planner.main_flow:kickoff"
run_basic = "trip_planner.main_basic:run"
plot = "trip_planner.main_flow:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_planner"]

[tool.crewai]
type = "crew"
