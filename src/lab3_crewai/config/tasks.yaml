write_task:
  description: >
    Escribe una descripción técnica detallada sobre: {topic}

    Incluye:
    - Los componentes o actores principales involucrados
    - Cómo interactúan o se conectan
    - La secuencia o flujo de operaciones
    - Detalles visuales que ayuden a dibujar un diagrama

    Escribe 3-5 frases detalladas. Sé específico y descriptivo.
  expected_output: "Una descripción técnica detallada de 3-5 frases con componentes, flujos y detalles visuales."
  agent: writer

review_task:
  description: >
    Revisa la descripción técnica anterior y enriquécela.

    Verifica que incluye:
    1. Todos los componentes clave están nombrados y descritos
    2. Las relaciones y flujos de datos son explícitos
    3. La secuencia de operaciones es clara
    4. Hay suficiente detalle visual para dibujar un diagrama

    Si falta algo, añádelo. Devuelve la versión mejorada con al menos 4-6 frases.
  expected_output: "El texto mejorado y enriquecido con todos los detalles necesarios para visualización."
  agent: reviewer

image_task:
  description: >
    Toma el texto aprobado por el revisor y usa la herramienta generate_image
    para crear una imagen estilo whiteboard.
    Pasa el texto completo como argumento 'approved_text' a la herramienta.
  expected_output: "La ruta al archivo de imagen generado."
  agent: image_creator
