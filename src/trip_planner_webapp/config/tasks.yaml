accommodation_consolidation_task:
  description: >
    Consolida los resultados de alojamiento de todas las noches del viaje
    en un único JSON. Recibes los resultados de cada noche como contexto.
    NO busques alojamientos nuevos, solo agrupa lo que ya se encontró.

    IMPORTANTE: Revisa que no haya duplicados:
    - Si dos noches consecutivas están en la misma zona, verifica que las
      3 opciones de cada noche sean DIFERENTES (nombres distintos).
    - Si hay duplicados, elimina el repetido y marca que esa opción
      se repite entre noches.
    - Asegúrate de que cada opción tiene una image_url DIFERENTE.

    FORMATO: Responde SOLO con un JSON válido, sin texto adicional.
  expected_output: >
    {
      "nights": [
        {"night": 1, "city": "...", "zone": "...", "options": [...]},
        {"night": 2, "city": "...", "zone": "...", "options": [...]}
      ],
      "price_range": {"min": 000, "max": 000}
    }
  human_input: true

trip_compilation_task:
  description: >
    Compila el plan de viaje completo con todos los elementos aprobados
    por el usuario: vuelos, transporte, actividades y alojamientos.

    INSTRUCCIONES:
    1. Revisa que los horarios de vuelo, actividades y alojamientos sean coherentes.
    2. Calcula el presupuesto total desglosado por categoría.
    3. Señala cualquier inconsistencia (ej: actividad programada antes de aterrizar).
    4. Genera un resumen ejecutivo del viaje.

    FORMATO: Responde SOLO con un JSON válido.
  expected_output: >
    {
      "trip_summary": {
        "origin": "...",
        "destination": "...",
        "dates": {"departure": "YYYY-MM-DD", "return": "YYYY-MM-DD"},
        "travelers": 0,
        "total_days": 0
      },
      "budget": {
        "flights": 000,
        "transport": 000,
        "activities": 000,
        "accommodation": 000,
        "total": 000,
        "per_person": 000
      },
      "warnings": ["lista de inconsistencias si las hay"],
      "highlights": ["los 3 momentos más destacados del viaje"]
    }
  human_input: false
